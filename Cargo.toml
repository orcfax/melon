[workspace]
members = [
  "crates/app",
  "crates/bus",
  "crates/core",
  "crates/crypto",
  "crates/ctl",
  "crates/fx",
  "crates/net",
  "crates/set",
  # "crates/seq",
]
resolver = "2"

[workspace.package]
description = "Melon: An experiment in Consensus"
documentation = "https://github.com/orcfax/consensus-rs"
version = "0.0.0"
edition = "2024"
repository = "https://github.com/orcfax/consensus-rs"
homepage = "https://github.com/orcfax/consensus-rs"
license = "MPL-2.0"
authors = ["waalge"]
rust-version = "1.94.0"

[workspace.metadata.release]
shared-version = true
tag-name = "v{{version}}"

[workspace.dependencies]
anyhow = "1.0.100"
axum = "0.8.8"
blake2 = "0.10.6"
blake3 = "1.8.5"
bls12_381 = { git = "https://github.com/zkcrypto/bls12_381.git", version = "0.8.0", branch = "ff-0.14", features = [
  "experimental",
  "group",
] }
chrono = "0.4.44"
clap = { version = "4.5.51", features = ["derive", "env"] }
dashmap = "6.2.1"
ed25519-dalek = "2.2.0"
ff = { version = "=0.14.0-pre.0", default-features = false }
futures = "0.3.32"
hex = "0.4.3"
libp2p = { version = "0.56.0", features = [
  "rendezvous",
  "ping",
  "noise",
  "mdns",
  "identify",
  "tcp",
  "tokio",
  "yamux",
  "macros",
  "gossipsub",
  "quic",
  "request-response",
  "kad",
] }
minicbor = { version = "2.1.1", features = ["alloc", "derive", "full"] }
num-traits = "0.2.19"
parking_lot = "0.12.5"
rand = "0.9.2"
reqwest = { version = "0.13.2", features = ["json", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_with = { version = "3.16.0", features = ["alloc", "hex"] }
sha2 = "0.10.9"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
toml = "0.9.11"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

melon-app = { path = "crates/app" }
melon-bus = { path = "crates/bus" }
melon-core = { path = "crates/core" }
melon-crypto = { path = "crates/crypto" }
melon-ctl = { path = "crates/ctl" }
melon-fx = { path = "crates/fx" }
melon-net = { path = "crates/net" }
melon-set = { path = "crates/set" }
# melon-seq = { path = "crates/seq" }
